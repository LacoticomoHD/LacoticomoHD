name: Öffnungszeiten aus OSM nachladen

# Täglich um 03:23 Uhr UTC alle Kacheln über Deutschland abgleichen.
# Manuell startbar unter „Actions" → dieser Ablauf → „Run workflow".
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      tiles:
        description: 'Nur bestimmte Kacheln, z. B. "K7-2,K4-1" (leer = alle)'
        required: false
        default: ''
      loose:
        description: 'Lockere Zuordnung (auch bei abweichendem Namen, wenn im 30-m-Umkreis eindeutig)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: osm-hours-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abgleich ausführen
        env:
          # Projekt-URL und öffentlicher Schlüssel stecken ohnehin in der Web-App.
          SUPABASE_URL: https://coydygpnumqxxealikqb.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_v7vCCl0c9OTgUT1vJ0YTdw_pqHM0H9A
          # Darf nur die Funktion osm_hours_import aufrufen (leere Zeiten befüllen).
          OSM_SYNC_TOKEN: ${{ secrets.OSM_SYNC_TOKEN }}
          TILES: ${{ inputs.tiles }}
          LOOSE_MATCH: ${{ inputs.loose }}
        run: node scripts/osm-hours-sync.mjs
